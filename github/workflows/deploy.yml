# Builds the site here on GitHub and sends the finished site to Cloudflare Pages.
#
# Why: Cloudflare's own build service allows only 500 builds a month per account (and one at a time),
# and every story saved in the admin panel is a commit, so a busy channel runs out. Building here
# costs nothing on a public repository, and a finished site sent this way ("direct upload") is not
# counted as a Cloudflare build.
#
# Needs two secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — the account id from the Cloudflare dashboard
#
# Also turn OFF Cloudflare's own builds, or both will deploy:
#   Cloudflare → Workers & Pages → the project → Settings → Builds & deployments
#   → Configure Production deployments → untick "Enable automatic production branch deployments"
#   → Preview deployments → None
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you deploy by hand from the Actions tab

# Saving three stories in a row starts three runs; this keeps only the last one, which also means
# fewer deployments.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # star-news-11 must match the Pages project name in the Cloudflare dashboard.
          command: pages deploy dist --project-name=star-news-11 --branch=main
